<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planejador de Implantação Ploomes</title>
<style>
  :root{
    --purple:#5b3df5;
    --purple-dark:#4a2fd6;
    --bg:#f4f5f8;
    --card:#ffffff;
    --border:#e4e6ee;
    --text:#20222b;
    --text-dim:#6b7080;
    --green:#1f9d55;
    --orange:#e08a1e;
    --red:#d64545;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
  #app{display:flex;min-height:100vh;}
  nav.sidebar{width:230px;flex-shrink:0;background:var(--card);border-right:1px solid var(--border);padding:0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;}
  .project-box{padding:16px 18px;border-bottom:1px solid var(--border);}
  .project-box .label{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);font-weight:700;margin-bottom:4px;}
  .project-box .empresa{font-size:15px;font-weight:700;color:var(--text);line-height:1.25;}
  .project-box .projeto{font-size:12.5px;color:var(--text-dim);margin-top:1px;}
  .project-box .switchbtn{margin-top:10px;font-size:12px;color:var(--purple);background:none;border:none;padding:0;cursor:pointer;font-weight:600;}
  nav.sidebar .navlist{padding:10px 0;flex:1;overflow-y:auto;}
  nav.sidebar .navbtn{display:flex;align-items:center;gap:10px;padding:12px 20px;cursor:pointer;color:var(--text-dim);font-size:14px;font-weight:500;border-left:3px solid transparent;}
  nav.sidebar .navbtn:hover{background:#f8f8fc;}
  nav.sidebar .navbtn.active{color:var(--purple);border-left-color:var(--purple);background:#f2effe;}
  main{flex:1;padding:28px 36px;max-width:1150px;}
  h2.pagetitle{margin:0 0 4px;font-size:22px;}
  p.pagesub{margin:0 0 24px;color:var(--text-dim);font-size:14px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:160px;}
  .field label{font-size:12px;color:var(--text-dim);font-weight:600;}
  .field input,.field select{padding:9px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:#fff;}
  button{cursor:pointer;font-family:inherit;}
  .btn-primary{background:var(--purple);color:#fff;border:none;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:600;}
  .btn-primary:hover{background:var(--purple-dark);}
  .btn-secondary{background:#fff;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px 14px;font-size:14px;font-weight:500;}
  .btn-secondary:hover{border-color:var(--purple);color:var(--purple);}
  button:disabled{opacity:.45;cursor:not-allowed;}
  button:disabled:hover{border-color:var(--border);color:var(--text);}
  .btn-danger{background:#fff;color:var(--red);border:1px solid #f3c9c9;border-radius:8px;padding:6px 10px;font-size:12px;}
  .btn-ghost{background:none;border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--text-dim);}
  .btn-ghost:hover{border-color:var(--purple);color:var(--purple);}
  .list-item{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;background:#fff;}
  .list-item .meta{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .list-item .actions{display:flex;gap:8px;}
  .pill-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px;}
  .pill{padding:8px 14px;border:1px solid var(--border);border-radius:20px;font-size:13px;font-weight:500;color:var(--text-dim);background:#fff;position:relative;display:flex;align-items:center;gap:6px;}
  .pill.active{background:var(--purple);color:#fff;border-color:var(--purple);}
  .pill.active .badge{background:rgba(255,255,255,.25);color:#fff;}
  .statusdot{display:inline-block;width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .dot-complete{background:var(--green);}
  .dot-partial{background:var(--orange);}
  .dot-none{background:#c7c9d4;}
  .question{padding:16px 0;border-bottom:1px solid var(--border);}
  .question:last-child{border-bottom:none;}
  .question .qlabel{font-size:14px;font-weight:600;margin-bottom:2px;}
  .question .qfriendly{font-size:13px;color:var(--text-dim);margin-bottom:10px;font-style:italic;}
  .opts{display:flex;flex-direction:column;gap:6px;}
  .opt{display:flex;align-items:flex-start;gap:8px;font-size:13.5px;cursor:pointer;padding:6px 8px;border-radius:6px;}
  .opt:hover{background:#f8f8fc;}
  .opt input{margin-top:3px;}
  .empty{color:var(--text-dim);font-size:14px;padding:20px 0;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  select#profileTemplatePick{padding:9px 10px;border:1px solid var(--border);border-radius:8px;}
  .assumption{background:#fff8e6;border:1px solid #f3dfa0;color:#8a6d1a;font-size:12.5px;padding:10px 14px;border-radius:8px;margin-bottom:18px;}
  .summary-block{margin-bottom:26px;}
  .summary-block h3{font-size:16px;border-bottom:2px solid var(--purple);display:inline-block;padding-bottom:4px;margin-bottom:12px;}
  .summary-team{margin-bottom:10px;}
  .summary-cat{margin-bottom:14px;}
  .summary-cat h4{font-size:13px;color:var(--purple);margin:0 0 6px;}
  .summary-q{font-size:13px;margin-bottom:3px;}
  .summary-q b{font-weight:600;}
  .val-sim{color:var(--green);font-weight:700;}
  .val-nao{color:var(--red);font-weight:700;}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;}
  .modal-overlay{position:fixed;inset:0;background:rgba(20,20,30,.4);display:flex;align-items:flex-start;justify-content:center;padding-top:8vh;z-index:50;}
  .modal{background:#fff;border-radius:var(--radius);padding:22px;width:420px;max-width:92vw;max-height:78vh;overflow-y:auto;}
  .modal h3{margin-top:0;}
  .proj-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;cursor:pointer;}
  .proj-item:hover{border-color:var(--purple);}
  .proj-item.current{border-color:var(--purple);background:#f2effe;}
  .proj-item .pname{font-weight:600;font-size:14px;}
  .proj-item .psub{font-size:12px;color:var(--text-dim);}
  .setup-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;width:100%;}
  .setup-card{background:#fff;border-radius:14px;padding:36px;width:440px;max-width:92vw;box-shadow:0 10px 40px rgba(30,20,80,.08);}
  .setup-card h2{margin-top:0;color:var(--purple);}
  table.matrix{border-collapse:collapse;width:100%;font-size:12.5px;}
  table.matrix th,table.matrix td{border:1px solid var(--border);padding:7px 10px;text-align:left;white-space:nowrap;}
  table.matrix th{background:#f8f8fc;position:sticky;top:0;}
  table.matrix td.catrow{background:#f2effe;font-weight:700;color:var(--purple);}
  table.matrix .qcol{position:sticky;left:0;background:#fff;max-width:260px;white-space:normal;}
  table.matrix td.catrow .qcol{background:#f2effe;}
  .matrix-wrap{overflow:auto;max-height:70vh;border:1px solid var(--border);border-radius:8px;}
  @media print{
    nav.sidebar,.toolbar,.no-print{display:none !important;}
    main{max-width:100%;padding:0;}
    body{background:#fff;}
  }
</style>
</head>
<body>
<div id="app">
  <nav class="sidebar" id="sidebar"></nav>
  <main id="main"></main>
</div>
<div id="modalRoot"></div>

<script>
/* ---------------- STORAGE / MIGRATION ---------------- */
const STORAGE_KEY = "ploomesImplantacaoV2";
const OLD_KEY = "ploomesImplantacaoV1";

function uid(){ return Math.random().toString(36).slice(2,10); }
function todayStr(){ return new Date().toLocaleDateString("pt-BR"); }

function blankProject(empresa, projeto){
  return { id:uid(), empresa, projeto: projeto||"Implantação", criadoEm: todayStr(),
    teams:[], users:[], profiles:[], activeProfileId:null, activeCategory: SCHEMA_KEY_FIRST,
    customUserFields:[], showAddUserField:false, editingUserId:null };
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  // migrate from V1 single-project format
  try{
    const oldRaw = localStorage.getItem(OLD_KEY);
    if(oldRaw){
      const old = JSON.parse(oldRaw);
      if(old && (old.teams || old.users || old.profiles)){
        const p = blankProject("Projeto migrado", "Implantação");
        p.teams = old.teams||[]; p.users = old.users||[]; p.profiles = old.profiles||[];
        p.activeProfileId = old.activeProfileId||null;
        p.activeCategory = old.activeCategory||SCHEMA_KEY_FIRST;
        return { projects:[p], activeProjectId: p.id, activeTab:"perfis", showSwitcher:false };
      }
    }
  }catch(e){}
  return { projects: [], activeProjectId: null, activeTab: "perfis", showSwitcher:false };
}
let state;
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function proj(){
  const p = state.projects.find(p=>p.id===state.activeProjectId) || null;
  if(p && !p.customUserFields) p.customUserFields = [];
  return p;
}

/* ---------------- PERMISSION SCHEMA (verbatim from Ploomes forms) ---------------- */
const VIS_EDIT_EXCLUDE = ["Todos","Sob sua responsabilidade/colaboração ou sob responsabilidade de membros da sua equipe","Apenas sob sua responsabilidade/colaboração","Nenhum"];

  {key:"cadastrarProdutosCliente", label:"Pode cadastrar novos produtos de cliente?", friendly:"Pode vincular um novo produto a um cliente?", options:SIMNAO, dependsOn:{key:"acessoProdutosCliente",values:["Sim"]}},
  {key:"editarProdutosCliente", label:"Pode editar produtos de cliente?", friendly:"Pode alterar os produtos já vinculados a um cliente?", options:SIMNAO, dependsOn:{key:"acessoProdutosCliente",values:["Sim"]}},
  {key:"excluirProdutosCliente", label:"Pode excluir produtos de cliente?", friendly:"Pode remover um produto vinculado a um cliente?", options:SIMNAO, dependsOn:{key:"acessoProdutosCliente",values:["Sim"]}},

  {key:"metaClientes", label:"Para quais usuários pode criar metas de clientes?", friendly:"Para quem ele(a) pode definir metas de clientes?", options:METAS_OPTS, dependsOn:{key:"acesso",values:["Sim"]}},

{key:"formulariosExternos", label:"Formulários externos", questions:[

  {key:"acessoEmails", label:"Tem acesso ao módulo de e-mails?", friendly:"Ele(a) envia/recebe e-mails pelo sistema?", options:SIMNAO},
  {key:"visualizarEmails", label:"E-mails que pode visualizar", friendly:"Ele(a) vê os e-mails de todo mundo vinculados ao cliente, ou só os próprios?", options:["Todos os e-mails quando vinculados ao cliente/Negócio","Somente seus e-mails"], dependsOn:{key:"acessoEmails",values:["Sim"]}},
  {key:"acessoChat", label:"Tem acesso ao módulo de chat?", friendly:"Ele(a) usa o chat interno?", options:SIMNAO},
  {key:"acessoRelatorios", label:"Tem acesso ao módulo de relatórios?", friendly:"Ele(a) precisa ver relatórios/dashboards?", options:SIMNAO},

  {key:"extrairDados", label:"Pode extrair dados para planilhas Excel ou PowerBI (se a integração estiver ativa)?", friendly:"Pode exportar dados para Excel/PowerBI?", options:SIMNAO},
  {key:"importarDados", label:"Pode importar dados a partir de planilha Excel?", friendly:"Pode importar uma planilha Excel para dentro do sistema?", options:SIMNAO},
]},
];
const SCHEMA_KEY_FIRST = SCHEMA[0].key;
const PROFILE_TEMPLATES = ["Administrador","Funcionário","Gestor Geral","Gestor de Equipe","Vendedor","Representante"];

/* ---------------- HELPERS ---------------- */
// Answers are namespaced "categoryKey__questionKey" because several categories
// reuse the same question key (e.g. "acesso", "editar", "excluir") — without the
// namespace, answering one category's question would silently overwrite another's.
function qKey(catKey, questionKey){ return catKey + "__" + questionKey; }
function isVisible(q, cat, answers){
  if(!q.dependsOn) return true;
  const val = answers[qKey(cat.key, q.dependsOn.key)];
  return q.dependsOn.values.includes(val);
}
function catStatus(cat, answers){
  let total=0, done=0;
  cat.questions.forEach(q=>{
    if(!isVisible(q, cat, answers)) return;
    total++;
    if(answers[qKey(cat.key, q.key)]) done++;
  });
  return {total, done, dot: done===0 ? "dot-none" : (done<total ? "dot-partial" : "dot-complete")};
}
function profileStatus(profile){
  let total=0, done=0;
  SCHEMA.forEach(cat=>{
    cat.questions.forEach(q=>{
      if(!isVisible(q, cat, profile.answers)) return;
      total++;
      if(profile.answers[qKey(cat.key, q.key)]) done++;
    });
  });
  return {total, done, dot: done===0 ? "dot-none" : (done<total ? "dot-partial" : "dot-complete")};
}
function esc(s){ return String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function valClass(v){ return v==="Sim" ? "val-sim" : (v==="Não" ? "val-nao" : ""); }

function validateProject(p){
  const issues = [];
  if(p.teams.length===0) issues.push("Cadastre pelo menos 1 equipe.");
  if(p.users.length===0) issues.push("Cadastre pelo menos 1 usuário.");
  p.profiles.forEach(pf=>{
    const st = profileStatus(pf);
    if(st.done<st.total) issues.push(`Perfil "${pf.nome}": ${st.total-st.done} pergunta(s) aplicável(is) ainda sem resposta.`);
  });
  return { ok: issues.length===0, issues };
}
function renderValidationBanner(v){
  if(v.ok) return "";
  return `<div class="assumption" style="background:#fdeaea;border-color:#f3b8b8;color:#a13a3a;">
    <b>⚠ Pendente antes de exportar/imprimir:</b>
    <ul style="margin:6px 0 0 18px;padding:0;">${v.issues.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>
  </div>`;
}

    state.activeProjectId = el.dataset.gotoProj;

    save(); renderAll();
  });
  root.querySelectorAll("[data-del-proj]").forEach(el=>el.onclick=(e)=>{

  });
}

    const st = profileStatus(pf);
    html += `<div style="margin-bottom:20px;"><div style="font-weight:700;font-size:15px;margin-bottom:8px;">${esc(pf.nome)} ${st.done<st.total?`<span style="color:var(--orange);font-size:12px;font-weight:600;">(${st.total-st.done} pergunta(s) pendente(s))</span>`:''}</div>`;
    SCHEMA.forEach(cat=>{
      const rows = cat.questions.filter(q=>isVisible(q,cat,pf.answers) && pf.answers[qKey(cat.key,q.key)]);
      if(rows.length===0) return;
      html += `<div class="summary-cat"><h4>${esc(cat.label)}</h4>`;
      rows.forEach(q=>{
        const ans = pf.answers[qKey(cat.key,q.key)];
        html += `<div class="summary-q">${esc(q.label)}: <b class="${valClass(ans)}">${esc(ans)}</b></div>`;
      });
      html += `</div>`;
    });
    html += `</div>`;
  });
  html += `</div>`;
  return html;
}

/* ---------------- CSV EXPORT ---------------- */
function csvEscape(v){
  const s = String(v??"");
  if(/[",\n;]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
  return s;
}
function buildExportRows(p){
  const rows = [];

  rows.push(["EQUIPES"]);
  rows.push(["Nome","Equipe-mãe","Gestor","Membros"]);
  p.teams.forEach(t=>{
    const parent = p.teams.find(pp=>pp.id===t.parentId);
    const gestor = p.users.find(u=>u.id===t.gestorId);
    const members = p.users.filter(u=>u.teamId===t.id).map(m=>m.nome).join(", ");
    rows.push([t.nome, parent?parent.nome:"", gestor?gestor.nome:"", members]);
  });

  rows.push([]);
  rows.push(["USUÁRIOS"]);
  const fieldLabels = p.customUserFields.map(f=>f.label);
  rows.push(["Nome","E-mail","Equipe","Perfil", ...fieldLabels]);
  p.users.forEach(u=>{
    const team = p.teams.find(t=>t.id===u.teamId);
    const profile = p.profiles.find(pf=>pf.id===u.profileId);
    const fieldVals = p.customUserFields.map(f=>(u.custom && u.custom[f.id]) || "");
    rows.push([u.nome, u.email||"", team?team.nome:"", profile?profile.nome:"", ...fieldVals]);
  });

  rows.push([]);
  rows.push(["PERFIS / PERMISSÕES"]);
  rows.push(["Categoria","Pergunta", ...p.profiles.map(pf=>pf.nome)]);
  SCHEMA.forEach(cat=>{
    cat.questions.forEach(q=>{
      const row = [cat.label, q.label];
      p.profiles.forEach(pf=>{
        if(!isVisible(q, cat, pf.answers)) row.push("–");
        else row.push(pf.answers[qKey(cat.key,q.key)] || "(pendente)");
      });
      rows.push(row);
    });
  });

  return rows;
}
function exportFullCsv(){
  const p = proj();
  const rows = buildExportRows(p);
  const csv = "﻿" + rows.map(r=>r.map(csvEscape).join(";")).join("\r\n");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `${p.empresa.replace(/[^a-z0-9]+/gi,"-")}-implantacao-completa.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---------------- MAIN RENDER + HANDLERS ---------------- */
function renderAll(){
  if(!proj()){ renderSetupScreen(); renderModal(); return; }
  renderSidebar();
  const main = document.getElementById("main");
  if(state.activeTab==="equipes") main.innerHTML = renderEquipes();
  else if(state.activeTab==="usuarios") main.innerHTML = renderUsuarios();
  else if(state.activeTab==="perfis") main.innerHTML = renderPerfis();
  else if(state.activeTab==="matriz") main.innerHTML = renderMatriz();
  else if(state.activeTab==="resumo") main.innerHTML = renderResumo();
  attachHandlers();
  renderModal();
}

function attachHandlers(){
  const p = proj();
  if(!p) return;

  // Equipes
  const addTeamBtn = document.getElementById("addTeamBtn");
  if(addTeamBtn){
    const submit = ()=>{
      const nome = document.getElementById("teamNome").value.trim();
      if(!nome) return;
      p.teams.push({id:uid(), nome, parentId: document.getElementById("teamParent").value||null, gestorId: document.getElementById("teamGestor").value||null});
      save(); renderAll();
    };
    addTeamBtn.onclick = submit;
    document.getElementById("teamNome").onkeydown=(e)=>{ if(e.key==="Enter") submit(); };
  }
  document.querySelectorAll("[data-del-team]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.delTeam;
    const t = p.teams.find(x=>x.id===id);
    if(!confirm(`Remover a equipe "${t.nome}"?`)) return;
    p.teams = p.teams.filter(x=>x.id!==id);
    p.users.forEach(u=>{ if(u.teamId===id) u.teamId=null; });
    save(); renderAll();
  });

  // Usuarios — campos personalizados
  const showAddFieldBtn = document.getElementById("showAddFieldBtn");
  if(showAddFieldBtn) showAddFieldBtn.onclick=()=>{ p.showAddUserField=true; save(); renderAll(); setTimeout(()=>document.getElementById("newFieldName")?.focus(),0); };
  const cancelAddFieldBtn = document.getElementById("cancelAddFieldBtn");
  if(cancelAddFieldBtn) cancelAddFieldBtn.onclick=()=>{ p.showAddUserField=false; save(); renderAll(); };
  const confirmAddFieldBtn = document.getElementById("confirmAddFieldBtn");
  if(confirmAddFieldBtn){
    const submitField = ()=>{
      const label = document.getElementById("newFieldName").value.trim();
      if(!label) return;
      p.customUserFields.push({id:uid(), label});
      p.showAddUserField = false;
      save(); renderAll();
    };
    confirmAddFieldBtn.onclick = submitField;
    document.getElementById("newFieldName").onkeydown=(e)=>{ if(e.key==="Enter") submitField(); if(e.key==="Escape"){ p.showAddUserField=false; save(); renderAll(); } };
  }
  document.querySelectorAll("[data-del-userfield]").forEach(b=>b.onclick=()=>{
    const id = b.dataset.delUserfield;
    const f = p.customUserFields.find(x=>x.id===id);
    if(!confirm(`Remover o campo "${f.label}"? Os valores preenchidos para esse campo em todos os usuários serão perdidos.`)) return;
    p.customUserFields = p.customUserFields.filter(x=>x.id!==id);
    p.users.forEach(u=>{ if(u.custom) delete u.custom[id]; });
    save(); renderAll();
  });

  // Usuarios — criar / editar
  const addUserBtn = document.getElementById("addUserBtn");
  if(addUserBtn){
    const submit = ()=>{
      const nome = document.getElementById("userNome").value.trim();
      if(!nome) return;
      const custom = {};
      document.querySelectorAll("[data-userfield]").forEach(el=>{ custom[el.dataset.userfield] = el.value.trim(); });
      const payload = { nome, email:document.getElementById("userEmail").value.trim(), teamId:document.getElementById("userTeam").value||null, profileId:document.getElementById("userProfile").value||null, custom };
      if(p.editingUserId){
        const u = p.users.find(x=>x.id===p.editingUserId);
        Object.assign(u, payload);
        p.editingUserId = null;
      } else {
        p.users.push({id:uid(), ...payload});
      }
      save(); renderAll();
    };
    addUserBtn.onclick = submit;
    document.getElementById("userNome").onkeydown=(e)=>{ if(e.key==="Enter") submit(); };
  }
  const cancelEditUserBtn = document.getElementById("cancelEditUserBtn");
  if(cancelEditUserBtn) cancelEditUserBtn.onclick=()=>{ p.editingUserId=null; save(); renderAll(); };
  document.querySelectorAll("[data-edit-user]").forEach(b=>b.onclick=()=>{
    p.editingUserId = b.dataset.editUser;
    save(); renderAll();
    document.getElementById("userNome")?.scrollIntoView({behavior:"smooth", block:"center"});
  });
  document.querySelectorAll("[data-del-user]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.delUser;
    const u = p.users.find(x=>x.id===id);
    if(!confirm(`Remover o usuário "${u.nome}"?`)) return;
    p.users = p.users.filter(x=>x.id!==id);
    if(p.editingUserId===id) p.editingUserId=null;
    save(); renderAll();
  });

  // Perfis
  const addProfileBtn = document.getElementById("addProfileBtn");
  if(addProfileBtn) addProfileBtn.onclick=()=>{
    const pick = document.getElementById("profileTemplatePick").value;
    const nome = pick || "Novo Perfil";
    const pf = {id:uid(), nome, answers:{}};
    p.profiles.push(pf);
    p.activeProfileId = pf.id;
    p.activeCategory = SCHEMA[0].key;
    save(); renderAll();
  };
  document.querySelectorAll("[data-select-profile]").forEach(el=>el.onclick=(e)=>{
    if(e.target.closest("[data-dup-profile]") || e.target.closest("[data-del-profile]")) return;
    p.activeProfileId = el.dataset.selectProfile;
    save(); renderAll();
  });
  document.querySelectorAll("[data-dup-profile]").forEach(el=>el.onclick=(e)=>{
    e.stopPropagation();
    const id = el.dataset.dupProfile;
    const orig = p.profiles.find(pf=>pf.id===id);
    const copy = {id:uid(), nome: orig.nome + " (cópia)", answers: {...orig.answers}};
    p.profiles.push(copy);
    p.activeProfileId = copy.id;
    save(); renderAll();
  });
  document.querySelectorAll("[data-del-profile]").forEach(el=>el.onclick=(e)=>{
    e.stopPropagation();
    const id = el.dataset.delProfile;
    const pf = p.profiles.find(x=>x.id===id);
    if(!confirm(`Excluir o perfil "${pf.nome}"?`)) return;
    p.profiles = p.profiles.filter(x=>x.id!==id);
    if(p.activeProfileId===id) p.activeProfileId=null;
    p.users.forEach(u=>{ if(u.profileId===id) u.profileId=null; });
    save(); renderAll();
  });
  const profileNameInput = document.getElementById("profileNameInput");
  if(profileNameInput) profileNameInput.onchange=()=>{
    const pf = p.profiles.find(x=>x.id===p.activeProfileId);
    if(pf){ pf.nome = profileNameInput.value.trim()||pf.nome; save(); renderAll(); }
  };
  document.querySelectorAll("[data-select-cat]").forEach(el=>el.onclick=()=>{
    p.activeCategory = el.dataset.selectCat;
    save(); renderAll();
  });
  document.querySelectorAll('input[type=radio][data-q]').forEach(el=>el.onchange=()=>{
    const pf = p.profiles.find(x=>x.id===p.activeProfileId);
    if(!pf) return;
    pf.answers[qKey(el.dataset.cat, el.dataset.q)] = el.value;
    save(); renderAll();
  });

  // Matriz
  const exportCsvBtn = document.getElementById("exportCsvBtn");
  if(exportCsvBtn) exportCsvBtn.onclick = ()=>{ if(!validateProject(p).ok) return; exportFullCsv(); };

  // Resumo
  const printBtn = document.getElementById("printBtn");
  if(printBtn) printBtn.onclick=()=>{ if(!validateProject(p).ok) return; window.print(); };
  const exportCsvBtnResumo = document.getElementById("exportCsvBtnResumo");
  if(exportCsvBtnResumo) exportCsvBtnResumo.onclick = ()=>{ if(!validateProject(p).ok) return; exportFullCsv(); };
  const exportBtn = document.getElementById("exportBtn");
  if(exportBtn) exportBtn.onclick=()=>{
    if(!validateProject(p).ok) return;
    const blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `${p.empresa.replace(/[^a-z0-9]+/gi,"-")}-backup.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };
  const importBtn = document.getElementById("importBtn");
  const importFile = document.getElementById("importFile");
  if(importBtn) importBtn.onclick=()=>importFile.click();
  if(importFile) importFile.onchange=(e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload=()=>{
      try{
        const parsed = JSON.parse(reader.result);
        if(parsed.projects){ state = parsed; }
        else if(parsed.teams){ // single-project legacy backup
          const np = blankProject("Projeto importado","Implantação");
          np.teams=parsed.teams||[]; np.users=parsed.users||[]; np.profiles=parsed.profiles||[];
          state.projects.push(np); state.activeProjectId = np.id;
        }
        save(); renderAll();
      }catch(err){ alert("Arquivo inválido."); }
    };
    reader.readAsText(file);
  };
}

state = loadState();
renderAll();
</script>
